<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>¿Quieres ser el amor de mi vida?</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gloock&family=Outfit:wght@300;400;600&family=Caveat:wght@500;700&display=swap"
    />
    <style>
      /* Layout: pantalla 1 = foto en forma de corazón + pregunta al centro; pantalla 2 = celebración con álbum de polaroids (carrusel deslizable en celular) */
      :root {
        --night: #1a0b16;
        --plum: #2d1226;
        --rose: #ff5d8f;
        --blush: #ffc2d4;
        --ink: #fff4f7;
        --muted: #c9a3b4;
        --paper: #fdf6f8;
        --paper-ink: #4a1f33;
        --display: "Gloock", Georgia, "Times New Roman", serif;
        --body: "Outfit", system-ui, -apple-system, sans-serif;
        --hand: "Caveat", "Comic Sans MS", cursive;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: radial-gradient(
            ellipse at 50% 35%,
            var(--plum) 0%,
            var(--night) 70%
          )
          fixed;
        background-color: var(--night);
        color: var(--ink);
        font-family: var(--body);
        -webkit-tap-highlight-color: transparent;
      }
      body.locked {
        overflow: hidden;
      }
      canvas#sky {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }
      main {
        position: relative;
        z-index: 1;
      }
      .wrap {
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }

      /* ---------- Pantalla de la pregunta ---------- */
      #ask {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
      }
      #ask .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(16px, 3.5vh, 26px);
        max-width: 640px;
        padding-block: 24px;
        perspective: 900px;
      }
      .parallax3d {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(16px, 3.5vh, 26px);
        transform-style: preserve-3d;
        will-change: transform;
      }
      .heart-photo {
        width: clamp(150px, 42vw, 220px);
        aspect-ratio: 1;
        max-width: 100%;
        animation: beat 1.4s ease-in-out infinite;
        filter: drop-shadow(0 0 22px rgba(255, 93, 143, 0.55));
        transform-style: preserve-3d;
        perspective: 600px;
      }
      .heart-photo svg {
        animation: float3d 6s ease-in-out infinite;
      }
      @keyframes float3d {
        0%,
        100% {
          transform: rotateY(-14deg) rotateX(6deg);
        }
        50% {
          transform: rotateY(14deg) rotateX(-4deg);
        }
      }
      .heart-photo svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.08);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.05);
        }
      }
      .eyebrow {
        font-family: var(--hand);
        font-size: clamp(1.4rem, 5vw, 1.9rem);
        color: var(--blush);
        margin: 0;
      }
      h1 {
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(2.2rem, 9vw, 4.4rem);
        line-height: 1.05;
        margin: 0;
        text-wrap: balance;
        letter-spacing: -0.01em;
      }
      h1 em {
        font-style: normal;
        color: var(--rose);
      }
      .buttons {
        display: flex;
        gap: 18px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        min-height: 76px;
      }
      button {
        font-family: var(--body);
        font-weight: 600;
        font-size: 1.1rem;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        padding: 14px 36px;
        transition:
          transform 0.25s ease,
          background 0.2s ease;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid var(--blush);
        outline-offset: 3px;
      }
      #yes {
        background: var(--rose);
        color: #2a0716;
        box-shadow: 0 8px 30px rgba(255, 93, 143, 0.45);
        position: relative;
        z-index: 8;
      }
      #yes:hover {
        background: #ff7aa4;
      }
      #no {
        background: rgba(26, 11, 22, 0.6);
        color: var(--muted);
        border: 1.5px solid rgba(201, 163, 180, 0.45);
        white-space: nowrap;
      }
      #no.loose {
        position: fixed;
        z-index: 6;
        transition:
          left 0.25s ease,
          top 0.25s ease;
      }
      .hint {
        font-size: 0.95rem;
        color: var(--muted);
        margin: 0;
        min-height: 1.4em;
      }

      /* ---------- Pantalla del sí ---------- */
      #yay {
        text-align: center;
        padding-block: clamp(32px, 7vh, 64px) 48px;
      }
      #yay .head {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 640px;
        margin: 0 auto;
      }
      #yay h1 {
        font-size: clamp(2.4rem, 10vw, 4.8rem);
      }
      .sub {
        font-family: var(--hand);
        font-size: clamp(1.5rem, 5vw, 2rem);
        color: var(--blush);
        margin: 0;
      }

      .album {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 22px;
        max-width: 1100px;
        margin: 36px auto 8px;
        padding: 12px 0 24px;
        perspective: 1100px;
      }
      .polaroid {
        background: var(--paper);
        color: var(--paper-ink);
        padding: 10px 10px 0;
        border-radius: 3px;
        width: 190px;
        flex: none;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
        transform: rotate(var(--r, 0deg));
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.3, 1),
          box-shadow 0.35s ease;
        cursor: zoom-in;
        border: none;
        font: inherit;
        text-align: center;
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
      }
      .polaroid.tilt {
        transform: rotate(0)
          perspective(900px)
          rotateX(var(--rx, 0deg))
          rotateY(var(--ry, 0deg))
          translateZ(30px)
          scale(1.05);
        box-shadow: calc(var(--ry, 0deg) * -0.6px) 22px 46px
          rgba(0, 0, 0, 0.55);
      }
      .polaroid::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 3px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
        transform: translateZ(40px);
        background: radial-gradient(
          circle at var(--gx, 50%) var(--gy, 0%),
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0) 55%
        );
      }
      .polaroid.tilt::after {
        opacity: 1;
      }
      .polaroid:hover {
        transform: rotate(0) translateY(-6px) scale(1.04);
      }
      .polaroid img {
        width: 100%;
        aspect-ratio: 4/5;
        object-fit: cover;
        display: block;
        border-radius: 1px;
        background: #e9dde2;
        transform: translateZ(18px);
      }
      .polaroid span {
        transform: translateZ(26px);
      }
      .polaroid span {
        display: block;
        font-family: var(--hand);
        font-size: 1.45rem;
        line-height: 1;
        padding: 10px 4px 14px;
      }
      .swipe {
        display: none;
        font-size: 0.9rem;
        color: var(--muted);
        margin: 0;
      }

      .letter {
        max-width: 46ch;
        margin: 28px auto 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .letter p {
        font-size: 1.12rem;
        color: var(--blush);
        line-height: 1.65;
        margin: 0;
      }
      .signature {
        font-family: var(--hand);
        font-size: 2.1rem;
        color: var(--rose);
      }
      .again {
        background: transparent;
        color: var(--muted);
        border: 1.5px solid rgba(201, 163, 180, 0.35);
        font-size: 0.95rem;
        padding: 10px 24px;
        margin-top: 8px;
      }
      .pop {
        animation: pop 0.7s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      @keyframes pop {
        from {
          transform: scale(0.7);
          opacity: 0.2;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Celular: álbum como carrusel deslizable */
      @media (max-width: 640px) {
        .album {
          flex-wrap: nowrap;
          justify-content: flex-start;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          gap: 18px;
          margin: 28px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 4px;
          padding: 14px 16vw 26px;
          scrollbar-width: none;
        }
        .album::-webkit-scrollbar {
          display: none;
        }
        .polaroid {
          width: 68vw;
          max-width: 270px;
          scroll-snap-align: center;
        }
        .polaroid:hover {
          transform: rotate(var(--r, 0deg));
        }
        .swipe {
          display: block;
        }
      }

      /* Visor de foto ampliada */
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(10, 3, 8, 0.88);
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top, 0px)) 20px
          max(20px, env(safe-area-inset-bottom, 0px));
      }
      .lightbox img {
        max-width: min(92vw, 560px);
        max-height: 80vh;
        border-radius: 6px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .lightbox button {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: calc(14px + env(safe-area-inset-right, 0px));
        background: var(--paper);
        color: var(--paper-ink);
        padding: 10px 18px;
        font-size: 1rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .heart-photo,
        .heart-photo svg,
        .pop {
          animation: none;
        }
        #ask .stage,
        .polaroid {
          transition: none;
        }
      }
    </style>

    <style>
      body {
        margin: 0;
      }
      img {
        max-width: 100%;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>

      </div>
      <p class="swipe">Desliza para ver más fotos →</p>

      <div class="letter">
        <p>
          Tú llenas de alegría mis días. Quiero que te quedes a mi lado hoy,
          mañana y siempre.
        </p>
        <span class="signature">Te amo ♥</span>
        <button class="again" id="again" type="button">
          Volver a preguntar
        </button>
      </div>
    </main>

    <div class="lightbox" id="lb" hidden>
      <img id="lbImg" alt="" />
      <button type="button" id="lbClose">Cerrar</button>
    </div>

    <script>
      (() => {
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const cv = document.getElementById("sky"),
          ctx = cv.getContext("2d");
        let W,
          H,
          dpr,
          hearts = [],
          bursts = [];
        function size() {
          dpr = Math.min(devicePixelRatio || 1, 2);
          W = innerWidth;
          H = innerHeight;
          cv.width = W * dpr;
          cv.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        size();
        addEventListener("resize", size);

        const colors = ["#ff5d8f", "#ffc2d4", "#ff8fb1", "#e8467a"];
        const pick = () => colors[Math.floor(Math.random() * colors.length)];
        function drawHeart(x, y, s, rot, color, alpha) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rot);
          ctx.scale(s, s);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(0, 0.35);
          ctx.bezierCurveTo(-1, -0.3, -0.5, -1, 0, -0.45);
          ctx.bezierCurveTo(0.5, -1, 1, -0.3, 0, 0.35);
          ctx.fill();
          ctx.restore();
        }
        function newHeart(anyY) {
          return {
            x: Math.random() * W,
            y: anyY ? Math.random() * H : H + 30,
            s: 6 + Math.random() * 16,
            v: 0.25 + Math.random() * 0.7,
            sway: Math.random() * Math.PI * 2,
            c: pick(),
            a: 0.12 + Math.random() * 0.3,
          };
        }
        const count = innerWidth < 640 ? 20 : 34;
        for (let i = 0; i < count; i++) hearts.push(newHeart(true));

        function burst(n) {
          for (let i = 0; i < n; i++) {
            const ang = Math.random() * Math.PI * 2,
              sp = 3 + Math.random() * 9;
            bursts.push({
              x: W / 2,
              y: H / 2.4,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp - 4,
              s: 8 + Math.random() * 14,
              r: Math.random() * 6,
              vr: (Math.random() - 0.5) * 0.2,
              c: pick(),
              life: 1,
            });
          }
        }
        function frame() {
          ctx.clearRect(0, 0, W, H);
          for (const h of hearts) {
            if (!reduce) {
              h.y -= h.v;
              h.sway += 0.015;
            }
            if (h.y < -30) Object.assign(h, newHeart(false));
            drawHeart(
              h.x + Math.sin(h.sway) * 14,
              h.y,
              h.s,
              Math.sin(h.sway) * 0.3,
              h.c,
              h.a,
            );
          }
          for (let i = bursts.length - 1; i >= 0; i--) {
            const b = bursts[i];
            b.x += b.vx;
            b.y += b.vy;
            b.vy += 0.18;
            b.vx *= 0.99;
            b.r += b.vr;
            b.life -= 0.006;
            if (b.life <= 0 || b.y > H + 40) {
              bursts.splice(i, 1);
              continue;
            }
            drawHeart(b.x, b.y, b.s, b.r, b.c, Math.min(1, b.life * 1.5));
          }
          requestAnimationFrame(frame);
        }
        frame();

        // Botones
        const body = document.body;
        const ask = document.getElementById("ask"),
          yay = document.getElementById("yay");
        const yes = document.getElementById("yes"),
          no = document.getElementById("no");
        const hint = document.getElementById("hint");
        const phrases = [
          "¿Estás segura?",
          "Piénsalo otra vez…",
          "¡Me romperás el corazón!",
          "Última oportunidad 🥺",
          "Ese botón no funciona",
          "Mejor dale al Sí ♥",
        ];
        let tries = 0,
          scale = 1;
        body.classList.add("locked");

        function runAway() {
          tries++;
          no.textContent = phrases[(tries - 1) % phrases.length];
          hint.textContent =
            tries > 2 ? "El botón “Sí” te está esperando…" : "";
          const maxScale = innerWidth < 640 ? 1.9 : 2.5;
          scale = Math.min(scale + 0.15, maxScale);
          yes.style.transform = `scale(${scale})`;
          if (!no.classList.contains("loose")) {
            const r = no.getBoundingClientRect();
            no.classList.add("loose");
            no.style.left = r.left + "px";
            no.style.top = r.top + "px";
          }
          const pad = 16,
            bw = no.offsetWidth,
            bh = no.offsetHeight;
          const yr = yes.getBoundingClientRect();
          let x,
            y,
            guard = 0;
          do {
            x = pad + Math.random() * Math.max(0, innerWidth - bw - pad * 2);
            y =
              pad +
              40 +
              Math.random() * Math.max(0, innerHeight - bh - pad * 2 - 80);
            guard++;
          } while (
            guard < 40 &&
            x < yr.right + 16 &&
            x + bw > yr.left - 16 &&
            y < yr.bottom + 16 &&
            y + bh > yr.top - 16
          );
          no.style.left = x + "px";
          no.style.top = y + "px";
        }
        no.addEventListener("mouseenter", runAway);
        no.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            runAway();
          },
          { passive: false },
        );
        no.addEventListener("click", (e) => {
          e.preventDefault();
          runAway();
        });

        yes.addEventListener("click", () => {
          ask.hidden = true;
          no.hidden = true;
          yay.hidden = false;
          body.classList.remove("locked");
          scrollTo(0, 0);
          burst(innerWidth < 640 ? 110 : 160);
          setTimeout(() => burst(70), 600);
          setTimeout(() => burst(50), 1300);
        });

        document.getElementById("again").addEventListener("click", () => {
          tries = 0;
          scale = 1;
          yes.style.transform = "";
          hint.textContent = "";
          no.textContent = "No";
          no.classList.remove("loose");
          no.style.left = no.style.top = "";
          no.hidden = false;
          yay.hidden = true;
          ask.hidden = false;
          body.classList.add("locked");
          scrollTo(0, 0);
        });

        // Visor de fotos
        const lb = document.getElementById("lb"),
          lbImg = document.getElementById("lbImg");
        document.getElementById("album").addEventListener("click", (e) => {
          const card = e.target.closest(".polaroid");
          if (!card) return;
          const img = card.querySelector("img");
          lbImg.src = img.src;
          lbImg.alt = img.alt;
          lb.hidden = false;
          body.classList.add("locked");
        });
        function closeLb() {
          lb.hidden = true;
          body.classList.remove("locked");
        }
        lb.addEventListener("click", (e) => {
          if (e.target !== lbImg) closeLb();
        });
        addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !lb.hidden) closeLb();
        });

        // ---------- Efecto 3D: inclinación de las polaroids con el puntero ----------
        if (!reduce) {
          const MAX = 12; // grados máximos de giro
          const finePointer = matchMedia(
            "(hover: hover) and (pointer: fine)",
          ).matches;
          if (finePointer)
            document.querySelectorAll(".polaroid").forEach((card) => {
            function move(e) {
              const r = card.getBoundingClientRect();
              const px = (e.clientX - r.left) / r.width; // 0..1
              const py = (e.clientY - r.top) / r.height;
              card.style.setProperty("--ry", (px - 0.5) * 2 * MAX + "deg");
              card.style.setProperty("--rx", (0.5 - py) * 2 * MAX + "deg");
              card.style.setProperty("--gx", px * 100 + "%");
              card.style.setProperty("--gy", py * 100 + "%");
              card.classList.add("tilt");
            }
            function leave() {
              card.classList.remove("tilt");
              card.style.removeProperty("--rx");
              card.style.removeProperty("--ry");
            }
            card.addEventListener("pointermove", move);
            card.addEventListener("pointerleave", leave);
          });

          // ---------- Parallax de la escena de la pregunta ----------
          const stage = document.querySelector("#ask .parallax3d");
          let tx = 0,
            ty = 0,
            cx = 0,
            cy = 0;
          function loop() {
            cx += (tx - cx) * 0.08;
            cy += (ty - cy) * 0.08;
            stage.style.transform = `rotateY(${cx}deg) rotateX(${cy}deg)`;
            requestAnimationFrame(loop);
          }
          loop();
          addEventListener("pointermove", (e) => {
            if (!ask.hidden) {
              tx = (e.clientX / innerWidth - 0.5) * 10;
              ty = (0.5 - e.clientY / innerHeight) * 8;
            }
          });
          // Giroscopio en móviles
          addEventListener("deviceorientation", (e) => {
            if (!ask.hidden && e.gamma != null) {
              tx = Math.max(-12, Math.min(12, e.gamma * 0.4));
              ty = Math.max(-8, Math.min(8, (e.beta - 45) * 0.3));
            }
          });
        }
      })();
    </script>
  </body>
</html>
